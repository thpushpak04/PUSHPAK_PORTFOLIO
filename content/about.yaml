heading: About
paragraphs:
  - >-
    I’m a Computer Science Engineering student at Dronacharya College of Engineering (Gurugram University),
    graduating in 2026. My work so far is in Core Java, object-oriented programming, data structures, DBMS, and web
    technologies.
  - >-
    I spend most of my time debugging, solving problems, and building small software systems through coursework and
    personal projects. Recent work includes a real-time LAN messaging platform, an AI-assisted JavaScript compiler,
    and a PHP/MySQL fuel-station locator.
  - >-
    In 2025 I interned at Indian Oil Corporation Limited in Noida, contributing to internal web applications, front-end
    modules, backend APIs, and database work alongside senior developers. I’m looking for engineering roles where I
    can keep building reliable software with a team.
focusAreas:
  - Core Java, object-oriented programming, and data structures & algorithms.
  - Database management, SQL, and MySQL.
  - Web applications with Node.js, Express.js, and REST APIs.
  - PHP and MySQL applications, including search and data handling.
  - Debugging, testing, and collaborating with a development team.
