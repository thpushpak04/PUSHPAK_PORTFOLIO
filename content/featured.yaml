heading: Featured Project
projects:
  - name: Convo
    role: Developer
    period: Oct 2025 - Apr 2026
    description: >-
      Real-time LAN messaging and social platform, formerly developed as Walkie-Talkie P2P Messenger. It grew from a
      basic peer-to-peer messenger into a shared-feed social platform for people on the same local network.
    bullets:
      - Developed a real-time LAN communication platform and evolved it from a basic P2P messenger into a social platform with shared feeds.
      - Implemented Socket.IO-based duplex communication for live chat rooms, instant messaging, and real-time content updates.
      - Integrated local file sharing and media upload with Multer and Express middleware.
      - Designed a responsive, lightweight interface for smooth communication across local network environments.
    techStack:
      - Node.js
      - Express.js
      - Socket.IO
      - JavaScript
      - Multer
    links:
      - label: GitHub
        href: https://github.com/thpushpak04/Convo2
